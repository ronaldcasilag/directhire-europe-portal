name: Daily Job Fetcher Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ATS Fetch Script
        run: npm start

      - name: Create Summary Report
        run: |
          echo "### 🚀 Daily Direct-Hire Job Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline executed successfully at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Database successfully updated and deployed." >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push New Data
        run: |
          git config --global user.name "JobBot Automation"
          git config --global user.email "bot@users.noreply.github.com"
          git add jobs.json
          git commit -m "Automated daily job update" || exit 0
          git push
