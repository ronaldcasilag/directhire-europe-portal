name: Daily Job Fetcher Pipeline

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows you to manually trigger the pipeline anytime from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Aggregator Script
        run: node fetchJobs.js

      - name: Commit & Push Updated Jobs Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "auto: daily aggregated direct-hire jobs update [skip ci]" || exit 0
          git push
